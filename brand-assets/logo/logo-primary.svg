<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" width="420" height="80" fill="none">
  <defs>
    <!-- Primary Amber / Gold Linear Gradient -->
    <linearGradient id="logoPrimaryAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#fbbf24" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Deep Vault Surface Fill -->
    <linearGradient id="logoVaultSurface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181a1f" />
      <stop offset="100%" stop-color="#090a0d" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#f59e0b" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- ICON EMBLEM (Left: 64x64 on 32-unit grid) -->
  <g transform="translate(8, 8)" filter="url(#logoShadow)">
    <!-- Base Squircle Badge -->
    <rect width="64" height="64" rx="18" fill="#0c0d10" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2" />

    <!-- Protective Vault Shield -->
    <path d="M32 10 L51 19 C51 37 43 49 32 58 C21 49 13 37 13 19 Z" 
          fill="url(#logoVaultSurface)" 
          stroke="url(#logoPrimaryAmber)" 
          stroke-width="3" 
          stroke-linejoin="round" />

    <!-- Biometric Fingerprint Ridges (Concentric 32-grid arcs) -->
    <path d="M22 32 C22 26 26 21 32 21 C38 21 42 26 42 32 C42 39 37 44 32 48 C28 44 25 41 23 37" 
          stroke="url(#logoPrimaryAmber)" 
          stroke-width="2.5" 
          stroke-linecap="round" />

    <path d="M27 35 C27 31 29 28 32 28 C35 28 37 31 37 35 C37 38 35 41 32 43" 
          stroke="url(#logoPrimaryAmber)" 
          stroke-width="2" 
          stroke-linecap="round" />

    <!-- Core Cryptographic Verification Node -->
    <circle cx="32" cy="35" r="2.5" fill="#fef08a" />

    <!-- Tendermint Consensus Status Point -->
    <circle cx="32" cy="15" r="2" fill="#10b981" />
  </g>

  <!-- TYPOGRAPHY LOCKUP (Right) -->
  <g transform="translate(90, 42)">
    <!-- Main Logotype: "Invoice Vault" -->
    <text font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="26" letter-spacing="-0.035em">
      <tspan fill="#ffffff">Invoice</tspan>
      <tspan dx="7" fill="url(#logoPrimaryAmber)" font-weight="700">Vault</tspan>
    </text>

    <!-- Micro-Tracked Protocol Tagline -->
    <text y="21" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-weight="600" font-size="8.5" fill="#a1a1aa" letter-spacing="0.24em">
      <tspan>DECENTRALIZED PROOF-OF-EXISTENCE</tspan>
    </text>
  </g>
</svg>
