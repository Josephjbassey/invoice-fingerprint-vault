services:
  - type: web
    name: invoice-fingerprint-vault
    runtime: python
    plan: free
    region: oregon
    buildCommand: ./render-build.sh
    startCommand: gunicorn vault_project.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com,http://localhost:8000,http://127.0.0.1:8000"
      - key: GNO_RPC_URL
        value: "https://rpc.onyx.testnets.gno.land:443"
      - key: GNO_CHAIN_ID
        value: "onyx-1"
      - key: GNO_REALM_PATH
        value: "gno.land/r/g12uesl2nr27jh8q63x06lrpwarrndwsngm2u3d6/vault"
      - key: GNOSCAN_BASE_URL
        value: "https://gnoscan.io"
