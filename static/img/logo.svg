<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 64" width="340" height="64" fill="none">
  <defs>
    <linearGradient id="logoAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#fbbf24" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="shieldFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181a1f" />
      <stop offset="100%" stop-color="#0c0d10" />
    </linearGradient>

    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#f59e0b" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- LOGO EMBLEM (Left Mark) -->
  <g transform="translate(6, 6)" filter="url(#logoGlow)">
    <!-- Base Rounded Badge -->
    <rect width="52" height="52" rx="14" fill="#0f1013" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" />

    <!-- Shield Perimeter -->
    <path d="M26 8 L42 15 C42 30 35 40 26 47 C17 40 10 30 10 15 Z" 
          fill="url(#shieldFill)" 
          stroke="url(#logoAmber)" 
          stroke-width="2.5" 
          stroke-linejoin="round" />

    <!-- Biometric Fingerprint Loop -->
    <path d="M18 26 C18 21 21 17 26 17 C31 17 34 21 34 26 C34 32 30 36 26 39 C23 36 20 33 19 30" 
          stroke="url(#logoAmber)" 
          stroke-width="2" 
          stroke-linecap="round" />

    <!-- Inner Core Loop -->
    <path d="M22 28 C22 25 24 23 26 23 C28 23 30 25 30 28 C30 31 28 33 26 35" 
          stroke="url(#logoAmber)" 
          stroke-width="1.75" 
          stroke-linecap="round" />

    <!-- Proof Star / Center Node -->
    <circle cx="26" cy="29" r="2" fill="#fef08a" />

    <!-- Active Consensus Node -->
    <circle cx="26" cy="12" r="1.5" fill="#10b981" />
  </g>

  <!-- LOGO TYPOGRAPHY (Right Lockup) -->
  <g transform="translate(72, 33)">
    <!-- Main Headline: "Invoice Vault" -->
    <text font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="800" font-size="22" letter-spacing="-0.03em">
      <tspan fill="#ffffff">Invoice</tspan>
      <tspan dx="5" fill="url(#logoAmber)">Vault</tspan>
    </text>

    <!-- Tagline: "DECENTRALIZED PROOF-OF-EXISTENCE" -->
    <text y="17" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="7.5" fill="#a1a1aa" letter-spacing="0.22em">
      <tspan>DECENTRALIZED PROOF-OF-EXISTENCE</tspan>
    </text>
  </g>
</svg>
